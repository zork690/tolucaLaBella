<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Algo interesante se está construyendo | Toluca la Bella</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Reemplaza 'assets/logo.png' por la ruta o nombre de la imagen de tu logo -->
    <img src="assets/toluca-la-bella.svg" alt="TOLUCA LA BELLA ANTI GOBIERNO" class="logo" onerror="this.style.display='none'">
    
    <h1>Algo interesante se está construyendo</h1>
    <p>TOLUCA LA BELLA PERO ANTI GOBIERNO, TODO LO QUE NOS MOLESTE DEL TRABAJO DE NUESTROS SERVIDORES PUBLICOS</p>
  </div>

</body>
</html>
