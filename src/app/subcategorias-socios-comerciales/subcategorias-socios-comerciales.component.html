<div>
    <p>{{subcategoria.categoria.nombre}}/{{subcategoria.nombre}}</p>
    <h3>{{subcategoria.nombre}}</h3>
    <!--<h4>{{subcategoria.metaDescripcion}}</h4>-->
</div>

<hr />
<div class="contentContainer">
    <div class="negocioRow">

        <ngx-spinner name="spinnerNegocioSubCategoria" bdOpacity=0.9 bdColor="#f4f4f9" size="small" color="black"
            type="ball-spin" [fullScreen]="false">
        </ngx-spinner>

        
            <div class="negocio" *ngFor="let negocio of negocios">
                <div *ngIf="negocio.valid" class="negocioInfo"
                    [routerLink]="['/directorio-de-negocios', subcategoria.categoria.nombre, subcategoria.nombre,  negocio.idNegocio]">
                    <img *ngIf="negocio.imagenes.length > 0"
                        src={{apiEndPoint+imagenesBasePath+negocio.imagenes[0].nombre}} class="negocioImage" />
                    <img *ngIf="negocio.imagenes.length == 0" src="../../assets/imagenes/unavailable.jpg"
                        class="negocioImage" />
                    <div class="detailInfo">
                        <h3 class="negocioTitle">{{negocio.nombrEmpresa}}</h3>
                    </div>
                </div>
            </div>
       

    </div>
</div>
