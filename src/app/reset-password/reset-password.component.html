<div class="card">
    <div class="card-body">
        <div class="login-form">
            <h4 class="text-center">
                <i class="fa fa-user-circle fa fa-4x" aria-hidden="true" style="color: #ef3b3a"></i>
            </h4>
            <br>
            <p>Ingresa tu correo a donde te enviaremos tu contraseña</p>
            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <input type="text" style="border-radius: 0px; background-color: #f2f2f2;" formControlName="correo"
                        placeholder="Email" class="form-control"
                        [ngClass]="{ 'is-invalid': enviado && f.correo.errors }" />
                    <div *ngIf="enviado && f.correo.errors" class="invalid-feedback">
                        <div *ngIf="f.correo.errors.required">Campo requerido</div>
                        <div *ngIf="f.correo.errors.email">Email invalido.</div>
                    </div>
                    <br>
                    <button class="btn btn-login btn-block m-b-30 m-t-30">Enviar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<ngx-spinner>
    <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>
