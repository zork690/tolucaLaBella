<div id="contenido" style="text-align: center;">
  <h3>Estamos por lanzar una plataforma de <span style="color: burlywood;">PUBLICIDAD</span>
     para Toluca</h3>
  <!--<h1>Toluca la Bella</h1>-->
  <img src="../../assets/imagenes/toluca-la-bella.png" id="tolucaLaBellaImg" />
  <h3>Se uno de los primeros 100 negocios que aparezcan publicados</h3>
  <h2>¡Ponte en contacto con nosotros!</h2>
  <h2>Ya solo nos faltan: <span style="color: red; font-weight: bolder;">{{conteo}}</span></h2>

    <i class="fas fa-smile fa-5x"></i>
  </ng-template>
  <h5>({{mensaje}})</h5>
</div>
