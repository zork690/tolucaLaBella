<div class="" *ngFor="let imagen of childImages">
    <div class="col-md-12">
        <img src={{apiEndPoint+imagenesBasePath+imagen.nombre}} class="imagenFluid" />
        <label for="checkValid"><a class="required">*</a>¿Es válida?</label>
        <input type="checkbox" class="" id="checkValid" [(ngModel)]="imagen.valid" />
    </div>
</div>
<div class="col-md-12 text-center">
    <button type="button" class="btn btn-warning btn-sm" (click)="updateImages()">Actualizar</button>
</div>
