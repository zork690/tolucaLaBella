<nav id="navegationBar">
    <div #categoriesButton id="categoriesButton">
        <i id="categoriesIcon" class="fas fa-list fa-3x" aria-hidden="true"></i>
    </div>
</nav>
<div #categoriesContainer class="divCategories">
    <div class="ul" #categories (click)="changingColorSelectedCategori($event)">
        <a>Peluquerias</a>
        <a>Ropa</a>
        <a>Computadoras</a>
        <a>Ferreterias</a>
        <a>Materiales de construcción</a>
        <a>Abarrotes</a>
        <a>Farmacias</a>
        <a>Hospitales</a>
        <a>Veterinarias</a>
        <a>Electrónica</a>
    </div>
</div>

<div class="contentContainer">

    <h4 class="nombreCategoria">{{categoria}}</h4>

    <div class="negocioRow">

        <div class="negocio" *ngFor="let negocio of negociosInfo">
            <div class="negocioInfo">
                <img src={{apiEndPoint+imagenesBasePath+negocio.imagenes[0].url}} class="negocioImage" />
                <!--<img src="../../assets/imagenes/unavailable.jpg" class="negocioImage" />-->
                <div class="detailInfo">
                    <p class="negocioTitle">{{negocio.nombre}}</p>
                    <div class="detailInfoCard">
                        <p>{{negocio.telefono}}</p>
                        <p>{{negocio.descripcion}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
</div>
